name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier Format Check
        run: pnpm format:check

      - name: Lint Workspace
        run: pnpm lint

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Verify Module Boundaries (DAG)
        run: pnpm verify:boundaries

      - name: Run Unit Tests
        run: pnpm test

      - name: Build All Workspaces
        run: pnpm build
