services:
  postgres:
    image: postgres:16-alpine
    container_name: society-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: society_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d society_erp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - society_net

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: society-erp-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:56432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - society_net

  redis:
    image: redis:7-alpine
    container_name: society-erp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - society_net

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: society-erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: LOCAL_MINIO_USER
      MINIO_ROOT_PASSWORD: LOCAL_MINIO_PASSWORD
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - society_net

  mailpit:
    image: axllent/mailpit:v1.20.5
    container_name: society-erp-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    networks:
      - society_net

networks:
  society_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
